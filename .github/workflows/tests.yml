name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Verify presentation dependency
        run: python -c "from pptx import Presentation; print('python-pptx disponível')"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q src execution tests
      - name: Validate JSON schemas
        run: |
          python -m json.tool schemas/audit_result.schema.json >/dev/null
          python -m json.tool schemas/opportunity_candidates.schema.json >/dev/null
